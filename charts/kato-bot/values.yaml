image:
  # -- Container image repository.
  repository: ghcr.io/zufardhiyaulhaq/kato-bot
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: "v0.3.0"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Lark open-platform base URL. Lark international: https://open.larksuite.com; Feishu (China): https://open.feishu.cn.
larkBaseUrl: https://open.larksuite.com
# -- List of kato clusters the bot can target. Each entry needs a unique name and the
# in-cluster (or reachable) kato REST URL; label is the optional picker button text.
# Set insecureSkipVerify: true to skip TLS cert verification for an https URL
# (self-signed certs on a trusted network only; MITM-exposed).
clusters:
  - name: default
    url: http://kato.kato.svc:8080
    # label: Default
    # insecureSkipVerify: false
# -- Predefined groups: run one usecase across a static list of targets in one
# cluster, reported natively into Lark. cluster must match a configured cluster.
groups: []
#  - name: critical-services
#    cluster: default
#    usecase: deployment-troubleshooting
#    concurrency: 5
#    targets:
#      - { namespace: payments, deployment: payment-api }
# -- Overall timeout for one group run (Go duration).
groupRunTimeout: 1800s
# -- Per-run client timeout for kato's synchronous POST /run (Go duration).
katoRunTimeout: 360s
# -- Lark SDK log verbosity (debug / info / warn / error).
logLevel: info
# -- Max in-flight kato runs before new submits get a "kato is busy" card.
maxConcurrentRuns: 4

api:
  # -- Enable the MCP + REST proxy listener on port 9090 (MCP at /mcp,
  # cluster-prefixed kato REST proxy at /api/v1/clusters/...). No auth:
  # anyone who can reach the port can run kato on every configured cluster —
  # keep it ClusterIP / network-restricted.
  enabled: true

lark:
  # -- Name of a pre-existing Secret holding LARK_APP_ID and LARK_APP_SECRET. When set,
  # the chart references it and does NOT create its own Secret (appId/appSecret ignored).
  existingSecret: ""
  # -- Lark app id. Required unless lark.existingSecret is set.
  appId: ""
  # -- Lark app secret. Required unless lark.existingSecret is set.
  appSecret: ""

# -- Pod resource requests and limits.
resources: {}
# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
