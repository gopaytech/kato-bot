image:
  # -- Container image repository.
  repository: ghcr.io/gopaytech/kato-bot
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: "v0.5.1"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Lark open-platform base URL. Lark international: https://open.larksuite.com; Feishu (China): https://open.feishu.cn.
larkBaseUrl: https://open.larksuite.com
# -- List of kato clusters the bot can target. Each entry needs a unique name and the
# in-cluster (or reachable) kato REST URL; label is the optional picker button text.
# Set insecureSkipVerify: true to skip TLS cert verification for an https URL
# (self-signed certs on a trusted network only; MITM-exposed).
clusters:
  - name: default
    url: http://kato.kato.svc:8080
    # label: Default
    # insecureSkipVerify: false
# -- Predefined groups: several usecases (each with its own targets) in one
# cluster. cluster must match a configured cluster.
groups: []
#  - name: critical-services
#    cluster: default
#    concurrency: 5
#    usecases:
#      - usecase: deployment-troubleshooting
#        targets:
#          - { namespace: payments, deployment: payment-api }
#      - usecase: http-connectivity-check
#        targets:
#          - { target: api.internal, port: "443", scheme: https, path: /healthz }
# -- Overall timeout for one group run (Go duration).
groupRunTimeout: 1800s
# -- Per-run client timeout for kato's synchronous POST /run (Go duration).
katoRunTimeout: 360s
# -- Lark SDK log verbosity (debug / info / warn / error).
logLevel: info
# -- Max in-flight kato runs before new submits get a "kato is busy" card.
maxConcurrentRuns: 4

api:
  # -- Enable the MCP + REST proxy listener on port 9090 (MCP at /mcp,
  # cluster-prefixed kato REST proxy at /api/v1/clusters/...). No auth:
  # anyone who can reach the port can run kato on every configured cluster —
  # keep it ClusterIP / network-restricted.
  enabled: true

lark:
  # -- Name of a pre-existing Secret holding LARK_APP_ID and LARK_APP_SECRET. When set,
  # the chart references it and does NOT create its own Secret (appId/appSecret ignored).
  existingSecret: ""
  # -- Lark app id. Required unless lark.existingSecret is set or only Telegram is enabled.
  appId: ""
  # -- Lark app secret. Required unless lark.existingSecret is set.
  appSecret: ""

telegram:
  # -- Enable the Telegram adapter. When true, a bot token is required (inline or via existingSecret).
  enabled: false
  # -- Name of a pre-existing Secret holding TELEGRAM_BOT_TOKEN. When set, the chart
  # references it and does NOT create its own Telegram Secret (botToken ignored).
  existingSecret: ""
  # -- Telegram bot token from BotFather. Required when telegram.enabled and no existingSecret.
  botToken: ""
  # -- Telegram Bot API base URL (override only for a self-hosted Bot API server).
  apiBaseUrl: https://api.telegram.org
  # -- getUpdates long-poll timeout (Go duration).
  pollTimeout: 30s
  # -- Restrict which Telegram chats may use the bot (allowlist). Empty (the default)
  # means open — any chat that can reach the bot may use it. Chat ids for groups are
  # NEGATIVE int64 (e.g. -1001234567890); a private chat's id equals the user's id
  # (positive). Combined with allowedUsers via AND: when both are set, a chat/user
  # pair must satisfy both to be let through. Strongly recommended for production —
  # find ids with @userinfobot, or read kato-bot's logs (every denied update logs
  # its chat and user id).
  allowedChats: []
  # -- Restrict which Telegram users may use the bot (allowlist). Empty (the default)
  # means open — any user may use the bot (subject to allowedChats). User ids are
  # always positive int64. Combined with allowedChats via AND (see above). Strongly
  # recommended for production.
  allowedUsers: []

groupSummary:
  # -- Enable the optional LLM group-summary (kato-bot's only LLM use).
  enabled: false
  # -- OpenAI-compatible base URL.
  baseUrl: https://api.openai.com/v1
  # -- Model name.
  model: gpt-4o-mini
  # -- Max completion tokens.
  maxTokens: 1024
  # -- Sampling temperature.
  temperature: "0.2"
  # -- Reference to an existing Secret holding the LLM API key. Preferred — keeps
  # the AI token independent of the Lark secret, and the key can be any name.
  # When name is set, apiKey is ignored.
  apiKeySecretRef:
    name: ""    # existing Secret name (in the release namespace)
    key: ""     # the key within that Secret whose value is the API token (required when name is set)
  # -- LLM API key, inline. When set (and apiKeySecretRef.name is empty), the chart
  # renders its own dedicated Secret (<name>-groupsummary) holding the key.
  # Ignored when apiKeySecretRef.name is set.
  apiKey: ""

# -- Pod resource requests and limits.
resources: {}
# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
