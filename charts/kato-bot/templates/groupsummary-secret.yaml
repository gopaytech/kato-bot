{{- if and (not .Values.groupSummary.apiKeySecretRef.name) .Values.groupSummary.apiKey }}
# Dedicated Secret for the group-summary LLM API key — separate from the Lark
# secret. Rendered only when groupSummary.apiKey is set inline and no
# groupSummary.apiKeySecretRef.name is provided.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kato-bot.name" . }}-groupsummary
  labels:
    {{- include "kato-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROUP_SUMMARY_API_KEY: {{ .Values.groupSummary.apiKey | quote }}
{{- end }}
