apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kato-bot.name" . }}
  labels:
    {{- include "kato-bot.labels" . | nindent 4 }}
spec:
  replicas: 1            # single replica: dial-out WebSocket, no inbound traffic
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kato-bot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kato-bot.labels" . | nindent 8 }}
      annotations:
        checksum/clusters: {{ include (print $.Template.BasePath "/clusters-configmap.yaml") . | sha256sum }}
        checksum/groups: {{ include (print $.Template.BasePath "/groups-configmap.yaml") . | sha256sum }}
    spec:
      volumes:
        - name: clusters
          configMap:
            name: {{ include "kato-bot.name" . }}-clusters
        - name: groups
          configMap:
            name: {{ include "kato-bot.name" . }}-groups
      containers:
        - name: kato-bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            # Use a pre-existing Secret (must hold LARK_APP_ID + LARK_APP_SECRET) when
            # lark.existingSecret is set; otherwise the chart-managed Secret. Rendered
            # only when Lark is actually configured (existingSecret, appId, or appSecret set).
            {{- if or .Values.lark.existingSecret .Values.lark.appId .Values.lark.appSecret }}
            - secretRef:
                name: {{ .Values.lark.existingSecret | default (include "kato-bot.name" .) }}
            {{- end }}
            # Telegram Secret (must hold TELEGRAM_BOT_TOKEN), rendered when telegram.enabled.
            {{- if .Values.telegram.enabled }}
            - secretRef:
                name: {{ .Values.telegram.existingSecret | default (printf "%s-telegram" (include "kato-bot.name" .)) }}
            {{- end }}
          env:
            - name: LARK_BASE_URL
              value: {{ .Values.larkBaseUrl | quote }}
            - name: KATO_CLUSTERS_FILE
              value: /etc/kato-bot/clusters.yaml
            - name: KATO_RUN_TIMEOUT
              value: {{ .Values.katoRunTimeout | quote }}
            - name: KATO_GROUPS_FILE
              value: /etc/kato-bot-groups/groups.yaml
            - name: GROUP_RUN_TIMEOUT
              value: {{ .Values.groupRunTimeout | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MAX_CONCURRENT_RUNS
              value: {{ .Values.maxConcurrentRuns | quote }}
            - name: API_ADDR
              value: {{ .Values.api.enabled | ternary ":9090" "" | quote }}
            {{- if .Values.telegram.enabled }}
            - name: TELEGRAM_API_BASE_URL
              value: {{ .Values.telegram.apiBaseUrl | quote }}
            - name: TELEGRAM_POLL_TIMEOUT
              value: {{ .Values.telegram.pollTimeout | quote }}
            {{- end }}
            - name: GROUP_SUMMARY_ENABLED
              value: {{ .Values.groupSummary.enabled | quote }}
            - name: GROUP_SUMMARY_BASE_URL
              value: {{ .Values.groupSummary.baseUrl | quote }}
            - name: GROUP_SUMMARY_MODEL
              value: {{ .Values.groupSummary.model | quote }}
            - name: GROUP_SUMMARY_MAX_TOKENS
              value: {{ .Values.groupSummary.maxTokens | quote }}
            - name: GROUP_SUMMARY_TEMPERATURE
              value: {{ .Values.groupSummary.temperature | quote }}
            {{- if .Values.groupSummary.apiKeySecretRef.name }}
            # LLM API key from an existing Secret + key of your choosing.
            - name: GROUP_SUMMARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.groupSummary.apiKeySecretRef.name }}
                  key: {{ required "groupSummary.apiKeySecretRef.key is required when apiKeySecretRef.name is set" .Values.groupSummary.apiKeySecretRef.key }}
            {{- else if .Values.groupSummary.apiKey }}
            # LLM API key from the chart-managed dedicated Secret (groupsummary-secret.yaml).
            - name: GROUP_SUMMARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kato-bot.name" . }}-groupsummary
                  key: GROUP_SUMMARY_API_KEY
            {{- end }}
          volumeMounts:
            - name: clusters
              mountPath: /etc/kato-bot
              readOnly: true
            - name: groups
              mountPath: /etc/kato-bot-groups
              readOnly: true
          ports:
            - name: health
              containerPort: 8080
            {{- if .Values.api.enabled }}
            - name: api
              containerPort: 9090
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
